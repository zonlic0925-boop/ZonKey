<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- ZonKey 皇冠标（2026-09-02 用户拍板）：金色皇冠 = 王冠气质，
       冠面中央白色钥匙剪影 = ZonKey 的「Key」特色（龙鳞环柄 + 鳞片双齿）。
       设计源：lucide chess-king 轮廓语言 + 英皇娱乐式饱满三角冠形，
       颜色沿用 Memphis 三色渐变（teal→yellow→coral），与全站 UI 一致。 -->
  <defs>
    <linearGradient id="zg" x1="8" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ECDC4"/>
      <stop offset="0.5" stop-color="#FFE66D"/>
      <stop offset="1" stop-color="#FF6B6B"/>
    </linearGradient>
  </defs>

  <!-- 冠带（基底饰条） -->
  <path d="M7 41.5H57V46.5A4.5 4.5 0 0 1 52.5 51H11.5A4.5 4.5 0 0 1 7 46.5Z" fill="url(#zg)" stroke="#1A1A2E" stroke-width="3" stroke-linejoin="round"/>

  <!-- 冠面（英皇式饱满三角冠形） -->
  <path d="M6 43V16L18 21L32 8.5L46 21L58 16V43Z" fill="url(#zg)" stroke="#1A1A2E" stroke-width="3" stroke-linejoin="round"/>

  <!-- 三冠珠（皇冠三尖顶） -->
  <circle cx="18" cy="21" r="2.6" fill="#FFF9F0" stroke="#1A1A2E" stroke-width="1.8"/>
  <circle cx="32" cy="8.5" r="2.6" fill="#FFF9F0" stroke="#1A1A2E" stroke-width="1.8"/>
  <circle cx="46" cy="21" r="2.6" fill="#FFF9F0" stroke="#1A1A2E" stroke-width="1.8"/>

  <!-- 冠面中央：钥匙剪影（ZonKey 特色） -->
  <g stroke="#1A1A2E" stroke-linejoin="round">
    <rect x="25.5" y="15.5" width="4.5" height="20" rx="1.4" fill="#FFF9F0" stroke-width="1.7"/>
    <rect x="30" y="28" width="7.5" height="3.4" rx="1.2" fill="#FFF9F0" stroke-width="1.7"/>
    <rect x="30" y="32.2" width="5" height="2.8" rx="1.2" fill="#FFF9F0" stroke-width="1.7"/>
    <path d="M27.75 20.6L31.2 22.6V26.6L27.75 28.6L24.3 26.6V22.6L27.75 20.6Z" fill="#FFF9F0" stroke-width="1.5"/>
  </g>

  <!-- 冠带锁孔（ZonKey 的 Key 点睛） -->
  <circle cx="32" cy="46.2" r="2.6" fill="#FFF9F0" stroke="#1A1A2E" stroke-width="1.8"/>
</svg>
